[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capivara2ptn"
version = "0.1.0"
description = "Fundação instalável e interface TUI da CAPIVARA2PTN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=6.12,<7",
    "textual-image>=0.14.2,<0.15",
    "Pillow>=11,<13",
]

[project.scripts]
capivara2ptn = "capivara2ptn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capivara2ptn = ["*.tcss", "assets/*.png", "prompts/*.md", "prompts/gates/*.md"]
