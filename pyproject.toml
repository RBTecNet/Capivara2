[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capivara-harness"
version = "0.1.0"
description = "Wizard TUI de inicialização do harness"
requires-python = ">=3.11"
dependencies = ["textual>=6,<7", "mcp>=1.30,<2", "httpx>=0.28,<1", "pydantic>=2.12,<3", "textual-image[textual]>=0.12,<0.13"]

[project.scripts]
capivara2 = "harness.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["*.toml", "assets/*.png", "assets/*.ans"]
